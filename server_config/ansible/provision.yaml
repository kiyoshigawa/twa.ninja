---
- name: Initial Web Server Provisioning
  hosts: web
  remote_user: root

  tasks:
    - name: Make .bashrc colorful and add ll alias
      copy:
        dest: ~/.bashrc
        content: |
          export LS_OPTIONS='--color=auto'
          eval "$(dircolors)"
          alias ls='ls $LS_OPTIONS'
          alias ll='ls $LS_OPTIONS -laph'

    - name: Disallow SSH password authentication
      lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: "^PasswordAuthentication"
        line: "PasswordAuthentication no"
        state: present
        validate: sshd -t -f %s

    - name: Restart sshd
      service:
        name: sshd
        state: restarted

    - name: Update and upgrade all apt packages
      apt:
        upgrade: yes
        update_cache: yes
        cache_valid_time: 86400 # One Day

    - name: Install various packages using apt
      apt:
        name:
          - ufw
          - git
          - vim
          - lsb-release
          - gnupg2
          - apt-transport-https
          - ca-certificates
          - python3-debian
          - nginx
          - certbot
          - python3-certbot-nginx
          - python3-pil
        state: latest

    - name: Setup ufw to allow ssh via port 22 from LAN
      community.general.ufw:
        rule: allow
        port: 22
        from_ip: 192.168.1.0/24

    - name: Setup ufw to allow ssh via port 22 from VPN
      community.general.ufw:
        rule: allow
        port: 22
        from_ip: 192.168.21.0/24

    - name: Setup ufw to allow web server access via port 80
      community.general.ufw:
        rule: allow
        port: 80

    - name: Setup ufw to allow web server access via port 443
      community.general.ufw:
        rule: allow
        port: 443

    - name: Enable ufw firewall
      community.general.ufw:
        state: enabled
        default: deny

    - name: Download Zola
      get_url:
        url: https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz
        dest: /tmp/zola.tar.gz

    - name: Extract Zola
      unarchive:
        src: /tmp/zola.tar.gz
        dest: /usr/local/bin/
        remote_src: yes

    - name: Clone Website Repository
      git:
        repo: https://github.com/kiyoshigawa/twa.ninja
        dest: ~/twa.ninja/
        force: true

    - name: Generate image thumbnails
      ansible.builtin.command:
        chdir: ~/twa.ninja/website
        cmd: python3 generate-thumbs.py
      register: thumbs_result
      changed_when: "' 0 thumbnails' not in thumbs_result.stdout"

    - name: Build website using zola
      ansible.builtin.command:
        chdir: ~/twa.ninja/website
        cmd: zola build

    - name: Make website public directory accessible to www-data
      copy:
        src: ~/twa.ninja/website/public/
        dest: /var/www/twa.ninja/
        owner: root
        group: www-data
        mode: 0775
        remote_src: true

    - name: Copy basic website config to /etc/nginx/conf.d
      copy:
        src: ./files/twa.ninja.conf
        dest: /etc/nginx/conf.d/twa.ninja.conf

    - name: Restart nginx
      service:
        name: nginx
        state: restarted

    - name: Use Certbot to Set up HTTPS for twa.ninja
      command: certbot --nginx -d twa.ninja -d www.twa.ninja -m tim@twa.ninja --agree-tos
