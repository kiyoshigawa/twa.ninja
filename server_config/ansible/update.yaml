---
- name: Web Server Update
  hosts: web
  remote_user: root

  tasks:
    - name: Update and upgrade all apt packages
      apt:
        upgrade: yes
        update_cache: yes
        cache_valid_time: 86400 # One Day

    - name: Update Website Repository to Latest
      git:
        repo: https://github.com/kiyoshigawa/twa.ninja
        dest: ~/twa.ninja/
        force: true
      register: git_result

    - name: Install Pillow for thumbnail generation
      apt:
        name: python3-pil
        state: present

    - name: Generate image thumbnails
      ansible.builtin.command:
        chdir: ~/twa.ninja/website
        cmd: python3 generate-thumbs.py
      register: thumbs_result
      changed_when: "' 0 thumbnails' not in thumbs_result.stdout"

    - name: Rebuild website using zola
      ansible.builtin.command:
        chdir: ~/twa.ninja/website
        cmd: zola build
      when: git_result.changed or thumbs_result.changed
      register: zola_result

    - name: Make website public directory accessible to www-data
      copy:
        src: ~/twa.ninja/website/public/
        dest: /var/www/twa.ninja/
        owner: root
        group: www-data
        mode: 0775
        remote_src: true

    - name: Restart nginx
      service:
        name: nginx
        state: restarted
